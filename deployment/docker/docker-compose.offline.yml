# ============================================================
# Enterprise Knowledge OS — 离线部署 Compose 配置
# ============================================================
# 适用场景：无互联网访问的内网环境
#
# 准备步骤：
#   1. 在有网络的机器上构建并导出镜像：
#      docker compose build
#      docker save enterprise-kos-backend:latest -o ekos-backend.tar
#      docker save enterprise-kos-frontend:latest -o ekos-frontend.tar
#      docker save python:3.12-slim -o python-3.12-slim.tar
#      docker save node:20-alpine -o node-20-alpine.tar
#
#   2. 将 .tar 文件和项目代码复制到离线机器
#
#   3. 在离线机器上导入镜像：
#      docker load -i python-3.12-slim.tar
#      docker load -i node-20-alpine.tar
#      docker load -i ekos-backend.tar
#      docker load -i ekos-frontend.tar
#
#   4. 启动服务：
#      docker compose -f docker-compose.offline.yml up -d
# ============================================================

services:
  # ── 后端 API 服务 ────────────────────────────────────────
  app:
    image: enterprise-kos-backend:latest   # 使用已导入的本地镜像，不拉取
    container_name: ekos-backend
    restart: unless-stopped
    pull_policy: never                     # 禁止尝试拉取远程镜像
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - deployment/docker/.env.docker
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - app_data:/app/data
      # 内网无网络时，如需使用本地已下载的 sentence-transformers 模型：
      # - /path/to/local/models:/root/.cache/torch/sentence_transformers:ro
    networks:
      - ekos_net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 前端 Web 服务 ────────────────────────────────────────
  frontend:
    image: enterprise-kos-frontend:latest
    container_name: ekos-frontend
    restart: unless-stopped
    pull_policy: never
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://app:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ekos_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
    name: ekos_data
    driver: local

networks:
  ekos_net:
    name: ekos_network
    driver: bridge
