# ============================================================
# Enterprise Knowledge OS — Docker Compose 部署
# ============================================================
# 启动:  docker compose up -d
# 停止:  docker compose down
# 查看:  docker compose logs -f
# ============================================================

services:
  # ── 后端 API 服务 ────────────────────────────────────────
  app:
    build:
      context: ../..           # 构建上下文：项目根目录
      dockerfile: deployment/docker/Dockerfile
    image: enterprise-kos-backend:${IMAGE_TAG:-latest}
    container_name: ekos-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - deployment/docker/.env.docker
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - app_data:/app/data     # 数据持久化
    networks:
      - ekos_net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 前端 Web 服务 ────────────────────────────────────────
  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    image: enterprise-kos-frontend:${IMAGE_TAG:-latest}
    container_name: ekos-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://app:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ekos_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
    name: ekos_data
    driver: local

networks:
  ekos_net:
    name: ekos_network
    driver: bridge
