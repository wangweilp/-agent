{{- /* ============================================================
Enterprise Knowledge OS — Backend Service
============================================================ */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-knowledge-os.fullname" . }}-backend
  labels:
    {{- include "enterprise-knowledge-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
      {{- if and (eq .Values.backend.service.type "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "enterprise-knowledge-os.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

---
{{- if .Values.frontend.enabled }}
{{- /* ============================================================
Enterprise Knowledge OS — Frontend Service
============================================================ */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-knowledge-os.fullname" . }}-frontend
  labels:
    {{- include "enterprise-knowledge-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "enterprise-knowledge-os.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
