      {{- include "enterprise-knowledge-os.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "enterprise-knowledge-os.selectorLabels" . | nindent 8 }}
